name: Suggest a change
description: Propose something new or a different way of doing something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation first. The solution comes after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
